# =============================================================================
#  tree-sitter-mssql · GitHub Actions
# -----------------------------------------------------------------------------
#  File                fuzz.yml
#  Workflow name       Fuzz parser
#  Triggers            pull_request touching the grammar, scanner, parser or checker
#                      schedule (weekly)
#                      workflow_dispatch
#  Purpose             Runs tree-sitter's libFuzzer harness (tree-sitter/fuzz-action)
#                      over the generated parser and the external scanner, seeded
#                      with the fixtures: a crash, hang or sanitizer report fails
#                      the job and uploads the reproducer. Short on pull requests,
#                      longer on the weekly run. Also fuzzes tree-check inspection
#                      and edit-history APIs with a pinned Rust libFuzzer job.
# =============================================================================

name: Fuzz parser

on:
  pull_request:
    paths:
      - 'grammar.js'
      - 'grammar/**'
      - 'src/scanner.c'
      - 'src/parser.c'
      - '.github/workflows/fuzz.yml'
      - 'package.json'
      - 'ci/tree-sitter-abi.txt'
      - 'crates/tree-check/**'
      - 'fuzz/**'
      - 'test/fixtures/**'
      - 'oracle/data/**'
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the tree-sitter CLI pin
        id: tree-sitter-pin
        run: node -p '"ref=v" + require("./package.json").devDependencies["tree-sitter-cli"]' >> "$GITHUB_OUTPUT"

      - name: Fuzz the parser and scanner
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        with:
          directory: .
          corpus: test/fixtures
          tree-sitter-version: ${{ steps.tree-sitter-pin.outputs.ref }}
          # Seconds: five minutes on a pull request, thirty on the weekly run.
          max-time: ${{ github.event_name == 'schedule' && '1800' || '300' }}
          timeout: '10'
          max-length: '4096'

  tree-check:
    name: tree-check fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pin shared with Verify
        with:
          toolchain: nightly-2026-11-01

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Seed tree-check with fixtures and oracle cases
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import json
          from pathlib import Path

          corpus = Path("fuzz/corpus/tree_check")
          corpus.mkdir(parents=True, exist_ok=True)

          def seed(data):
              (corpus / hashlib.sha256(data).hexdigest()).write_bytes(data)

          for path in sorted(Path("test/fixtures").glob("*.sql")):
              seed(path.read_bytes())
          for path in sorted(Path("oracle/data").rglob("*.jsonl")):
              for line in path.read_text(encoding="utf-8").split("\n"):
                  if not line.strip():
                      continue
                  case = json.loads(line)
                  seed(case["source"].encode("utf-8"))
                  if "edits" in case:
                      seed(line.encode("utf-8"))
          PYEOF

      - name: Fuzz tree-check consumer APIs
        env:
          MAX_TIME: ${{ github.event_name == 'schedule' && '1800' || '300' }}
        run: cargo fuzz run tree_check -- -max_total_time="$MAX_TIME" -timeout=1 -max_len=4096

      - name: Upload tree-check reproducer on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-check-fuzz-reproducer
          path: fuzz/artifacts/tree_check/
          if-no-files-found: ignore
