# =============================================================================
#  tree-sitter-mssql · GitHub Actions
# -----------------------------------------------------------------------------
#  File                oracle-engine.yml
#  Workflow name       Oracle engine
#  Triggers            pull_request touching the oracle runner, cases or verdicts
#                      schedule (weekly)
#                      workflow_dispatch
#  Purpose             Runs the PARSEONLY runner (oracle/runners/ParseOnly) against
#                      real SQL Server engines in Linux containers, pinned by
#                      digest: its self-test first, then every oracle case at
#                      every compatibility level the engine supports. The new
#                      verdicts are uploaded and compared with the committed
#                      LocalDB verdicts; differences are reported for
#                      classification, not treated as failures. Runner or
#                      infrastructure failures fail the job.
# =============================================================================

name: Oracle engine

on:
  pull_request:
    paths:
      - 'oracle/runners/**'
      - 'oracle/data/kit/**'
      - 'oracle/data/probes/**'
      - 'oracle/data/verdicts/**'
      - 'scripts/verdict-diff.mjs'
      - '.github/workflows/oracle-engine.yml'
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # SQL Server 2025 on Linux judges slowly (8-11 min for 934 cases, over 15 for 1,574).
    # Both initial QUOTED_IDENTIFIER settings are measured.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQL Server 2017 CU31 GDR20
            image: mcr.microsoft.com/mssql/server:2017-CU31-GDR20-ubuntu-18.04@sha256:5f6fd78f8752390dbd3584b91dee463f1f4b2b30beef9af3fd35753d32940c52
            pid: Developer
            levels: '100,110,120,130,140'
          - name: SQL Server 2019 CU32 GDR13
            image: mcr.microsoft.com/mssql/server:2019-CU32-GDR13-ubuntu-20.04@sha256:debdc21628cddd1a4433371c601c8dee9bad3533ae8b18fe9dc8c5596368b10d
            pid: Developer
            levels: '100,110,120,130,140,150'
          - name: SQL Server 2022 CU28
            image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
            pid: Developer
            levels: '100,110,120,130,140,150,160'
          - name: SQL Server 2025 CU11
            image: mcr.microsoft.com/mssql/server:2025-CU11-ubuntu-24.04@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9
            pid: EnterpriseDeveloper
            levels: '100,110,120,130,140,150,160,170'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Start the engine
        # A throwaway password for a throwaway container: generated here, masked, never stored.
        env:
          IMAGE: ${{ matrix.image }}
          PID: ${{ matrix.pid }}
        run: |
          set -euo pipefail
          password="P$(openssl rand -hex 16)!a1"
          echo "::add-mask::${password}"
          echo "MSSQL_PASSWORD=${password}" >> "$GITHUB_ENV"
          MSSQL_SA_PASSWORD="${password}" docker run -d --name mssql \
            -e ACCEPT_EULA=Y -e MSSQL_PID="${PID}" -e MSSQL_SA_PASSWORD \
            -p 1433:1433 "${IMAGE}"

      - name: Build the runner
        working-directory: oracle/runners/ParseOnly
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore

      - name: Wait for the engine, then run the runner's self-test
        # Exit 2 means the engine is not reachable yet; 1 is a real self-test failure.
        run: |
          set -u
          for _ in $(seq 1 60); do
            dotnet oracle/runners/ParseOnly/bin/Release/net10.0/ParseOnly.dll --self-test --server localhost,1433 && exit 0
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            sleep 5
          done
          docker logs mssql | tail -50
          echo '::error::The engine did not become reachable within 5 minutes.'
          exit 1

      - name: Check the OFF session contract
        run: dotnet oracle/runners/ParseOnly/bin/Release/net10.0/ParseOnly.dll --self-test --server localhost,1433 --quoted-identifier off

      - name: Judge every oracle case set
        # grammar-kit's cases and every probe set; one verdict file per set and session.
        env:
          LEVELS: ${{ matrix.levels }}
        run: |
          set -euo pipefail
          mkdir -p verdicts
          # One verdict file per set and session; the compare step reads the same plan.
          for set in oracle/data/kit/cases.jsonl oracle/data/probes/*.jsonl; do
            name="$(basename "$set" .jsonl)"
            if [ "$set" = oracle/data/kit/cases.jsonl ]; then name=kit; fi
            for mode in on off; do
              suffix=""
              if [ "$name" = quoted-identifier ] || [ "$mode" = off ]; then suffix=".qi-${mode}"; fi
              dotnet oracle/runners/ParseOnly/bin/Release/net10.0/ParseOnly.dll \
                --server localhost,1433 --levels "$LEVELS" --quoted-identifier "$mode" \
                --cases "$set" --out "verdicts/${name}${suffix}.json"
              echo "${name}${suffix}" >> "$RUNNER_TEMP/verdict-plan.txt"
            done
          done

      - name: Compare with the committed LocalDB verdicts
        run: |
          set -euo pipefail
          # The committed LocalDB file drops the set name for the kit cases (localdb-17.0.1000.7[.qi-off].json).
          while read -r out; do
            committed=".${out}"
            if [ "${out%%.*}" = kit ]; then committed="${out#kit}"; fi
            node scripts/verdict-diff.mjs "oracle/data/verdicts/localdb-17.0.1000.7${committed}.json" "verdicts/${out}.json"
          done < "$RUNNER_TEMP/verdict-plan.txt"

      - name: Upload the verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdicts-${{ strategy.job-index }}
          path: verdicts/
          if-no-files-found: ignore
